# E7: pillar_occluder interrupts the view of marker 2 on the way. Either docked within tolerance,
# or FAILED with the robot stopped. No collision either way (keep_out lists the obstacles:
# centre, radius of the footprint, from docs/world_and_robot.md).
description: docking_world, a pillar blocks the view of the goal marker
world: docking_world
spawn: {x: 2.0, y: 0.9, yaw: 2.51}
keep_out:
  - {name: box_a, x: 2.6, y: -1.6, r: 0.42}
  - {name: box_b, x: -2.4, y: 1.8, r: 0.47}
  - {name: box_c, x: -0.5, y: -2.5, r: 0.29}
  - {name: pillar_1, x: 0.5, y: 2.5, r: 0.2}
  - {name: pillar_occluder, x: 0.25, y: 1.975, r: 0.15}
trials:
  - goal: {marker_id: 2}
    expect: docked_or_stopped
    time_limit: 150.0
