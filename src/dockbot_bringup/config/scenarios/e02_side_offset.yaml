# E2: robot 1 m to the side of the marker normal, yawed 30 degrees (clockwise from +x, which
# turns it toward the marker), docked within tolerance.
description: single_dock, 1 m off the normal, yawed 30 degrees
world: single_dock
spawn: {x: 1.0, y: 1.0, yaw: -0.5236}
markers:
  0: {x: 3.0, y: 0.0, yaw: 3.14159}
trials:
  - goal: {marker_id: 0}
    expect: docked
    time_limit: 120.0
